name: Bootstrap pnpm lockfile

on:
  push:
    branches: [ares-2/6-ai-maintainer-revalidation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ares-2/6-ai-maintainer-revalidation }
      - uses: pnpm/action-setup@v4
        with: { version: 11.23.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: commit pnpm lockfile"
            git push
          fi
