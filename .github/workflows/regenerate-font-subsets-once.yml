name: Regenerate font subsets once

on:
  push:
    branches:
      - ares-2.3/home-entry-surface
    paths:
      - .github/workflows/regenerate-font-subsets-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ares-2.3/home-entry-surface
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install font tooling
        run: python -m pip install 'fonttools[woff]' brotli zopfli
      - name: Inspect upstream arrow coverage
        run: |
          mkdir -p /tmp/ares-fonts
          curl -sSf -o '/tmp/ares-fonts/Newsreader.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz,wght%5D.ttf'
          curl -sSf -o '/tmp/ares-fonts/Newsreader-Italic.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz,wght%5D.ttf'
          curl -sSf -o '/tmp/ares-fonts/IBMPlexSans.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth,wght%5D.ttf'
          python - <<'PY' > font-cmap-diagnostic.txt
          from fontTools.ttLib import TTFont
          paths = [
              '/tmp/ares-fonts/Newsreader.ttf',
              '/tmp/ares-fonts/Newsreader-Italic.ttf',
              '/tmp/ares-fonts/IBMPlexSans.ttf',
          ]
          for path in paths:
              font = TTFont(path)
              cmap = font.getBestCmap() or {}
              print(path)
              for cp in range(0x2190, 0x2195):
                  print(f'U+{cp:04X}: {cmap.get(cp)}')
          PY
      - name: Regenerate authoritative subsets
        run: bash tools/build-fonts.sh
      - name: Append generated arrow coverage
        run: |
          python - <<'PY' >> font-cmap-diagnostic.txt
          from fontTools.ttLib import TTFont
          paths = [
              'src/styles/fonts/newsreader-latin.woff2',
              'src/styles/fonts/newsreader-italic-latin.woff2',
              'src/styles/fonts/plexsans-latin.woff2',
          ]
          for path in paths:
              font = TTFont(path)
              cmap = font.getBestCmap() or {}
              print(path)
              for cp in range(0x2190, 0x2195):
                  print(f'U+{cp:04X}: {cmap.get(cp)}')
          PY
      - name: Record diagnostic only
        run: |
          git restore -- src/styles/fonts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add font-cmap-diagnostic.txt
          git commit -m 'Record upstream arrow font coverage diagnostic'
          git push origin HEAD:ares-2.3/home-entry-surface
