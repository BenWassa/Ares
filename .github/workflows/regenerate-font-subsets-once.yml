name: Regenerate font subsets once

on:
  push:
    branches:
      - ares-2.3/home-entry-surface
    paths:
      - .github/workflows/regenerate-font-subsets-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ares-2.3/home-entry-surface
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install font tooling
        run: python -m pip install 'fonttools[woff]' brotli zopfli
      - name: Capture generator failure
        id: generator
        continue-on-error: true
        run: bash tools/build-fonts.sh > font-build-error.txt 2>&1
      - name: Record generator diagnostic
        if: always()
        run: |
          git restore -- src/styles/fonts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add font-build-error.txt
          git commit -m 'Record font generator failure diagnostic'
          git push origin HEAD:ares-2.3/home-entry-surface
      - name: Preserve generator failure
        if: steps.generator.outcome != 'success'
        run: exit 1
