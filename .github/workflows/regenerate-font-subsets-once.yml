name: Regenerate font subsets once

on:
  push:
    branches:
      - ares-2.3/home-entry-surface
    paths:
      - .github/workflows/regenerate-font-subsets-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ares-2.3/home-entry-surface
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install font tooling
        run: python -m pip install 'fonttools[woff]' brotli zopfli
      - name: Inspect all upstream arrow glyphs
        run: |
          mkdir -p /tmp/ares-fonts
          curl -sSf -o '/tmp/ares-fonts/Newsreader.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz,wght%5D.ttf'
          curl -sSf -o '/tmp/ares-fonts/Newsreader-Italic.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz,wght%5D.ttf'
          curl -sSf -o '/tmp/ares-fonts/IBMPlexSans.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth,wght%5D.ttf'
          python - <<'PY' > font-arrow-diagnostic.txt
          import unicodedata
          from fontTools.ttLib import TTFont
          for path in [
              '/tmp/ares-fonts/Newsreader.ttf',
              '/tmp/ares-fonts/Newsreader-Italic.ttf',
              '/tmp/ares-fonts/IBMPlexSans.ttf',
          ]:
              font = TTFont(path)
              cmap = font.getBestCmap() or {}
              print(path)
              matches = []
              for cp, glyph in sorted(cmap.items()):
                  try:
                      name = unicodedata.name(chr(cp))
                  except ValueError:
                      continue
                  if 'ARROW' in name:
                      matches.append((cp, glyph, name))
              if not matches:
                  print('NO UNICODE ARROWS')
              for cp, glyph, name in matches:
                  print(f'U+{cp:04X}: {glyph} — {name}')
          PY
      - name: Record diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add font-arrow-diagnostic.txt
          git commit -m 'Record upstream arrow glyph inventory'
          git push origin HEAD:ares-2.3/home-entry-surface
