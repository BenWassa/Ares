name: Regenerate font subsets once

on:
  push:
    branches:
      - ares-2.3/home-entry-surface
    paths:
      - .github/workflows/regenerate-font-subsets-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ares-2.3/home-entry-surface
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install font tooling
        run: python -m pip install 'fonttools[woff]' brotli zopfli
      - name: Test minimal Newsreader U+2192 injection
        run: |
          mkdir -p /tmp/ares-fonts
          curl -sSf -o '/tmp/ares-fonts/Newsreader.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz,wght%5D.ttf'
          curl -sSf -o '/tmp/ares-fonts/Newsreader-Italic.ttf' 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz,wght%5D.ttf'
          python -m fontTools.varLib.instancer '/tmp/ares-fonts/Newsreader.ttf' wght=400:700 -o '/tmp/ares-fonts/nr.ttf'
          python -m fontTools.varLib.instancer '/tmp/ares-fonts/Newsreader-Italic.ttf' wght=400:700 -o '/tmp/ares-fonts/nri.ttf'
          python - <<'PY'
          from fontTools.pens.ttGlyphPen import TTGlyphPen
          from fontTools.ttLib import TTFont

          def add_arrow(path):
              font = TTFont(path)
              if 0x2192 in (font.getBestCmap() or {}):
                  return
              name = 'arrowright.ares'
              upem = font['head'].unitsPerEm
              advance = round(upem * 0.72)
              left = round(upem * 0.09)
              shaft_end = round(upem * 0.44)
              tip = round(upem * 0.63)
              center = round(upem * 0.35)
              shaft_half = round(upem * 0.035)
              head_half = round(upem * 0.15)
              pen = TTGlyphPen(None)
              pen.moveTo((left, center - shaft_half))
              pen.lineTo((shaft_end, center - shaft_half))
              pen.lineTo((shaft_end, center - head_half))
              pen.lineTo((tip, center))
              pen.lineTo((shaft_end, center + head_half))
              pen.lineTo((shaft_end, center + shaft_half))
              pen.lineTo((left, center + shaft_half))
              pen.closePath()
              order = font.getGlyphOrder()
              font.setGlyphOrder(order + [name])
              font['glyf'][name] = pen.glyph()
              font['hmtx'][name] = (advance, left)
              for cmap in font['cmap'].tables:
                  if cmap.isUnicode():
                      cmap.cmap[0x2192] = name
              font['maxp'].numGlyphs = len(font.getGlyphOrder())
              font.save(path)
              check = TTFont(path)
              assert 0x2192 in (check.getBestCmap() or {}), path

          for path in ['/tmp/ares-fonts/nr.ttf', '/tmp/ares-fonts/nri.ttf']:
              add_arrow(path)
          PY
          pyftsubset '/tmp/ares-fonts/nr.ttf' --output-file='/tmp/ares-fonts/nr.woff2' --flavor=woff2 --unicodes='U+2192' --no-hinting
          pyftsubset '/tmp/ares-fonts/nri.ttf' --output-file='/tmp/ares-fonts/nri.woff2' --flavor=woff2 --unicodes='U+2192' --no-hinting
          python - <<'PY'
          from fontTools.ttLib import TTFont
          for path in ['/tmp/ares-fonts/nr.woff2', '/tmp/ares-fonts/nri.woff2']:
              font = TTFont(path)
              assert 0x2192 in (font.getBestCmap() or {}), path
              print(f'{path}: U+2192 present')
          PY
