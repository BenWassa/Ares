name: Build, verify and deploy Ares

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      index_sha: ${{ steps.artifact-hash.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.23.0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - name: Upload merged-main rendered evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: release-evidence
          if-no-files-found: ignore
      - name: Upload merged-main Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Record exact tested HTML hash
        id: artifact-hash
        shell: bash
        run: echo "index_sha=$(sha256sum dist/index.html | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: [build-and-verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify live Pages origin matches the tested artifact
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_INDEX_SHA: ${{ needs.build-and-verify.outputs.index_sha }}
        run: node scripts/verify-live.mjs
